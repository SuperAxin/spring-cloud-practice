name: Mirror to GitLab

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push to GitLab
        run: |
          git config --global user.name "mirror-bot"
          git config --global user.email "mirror@example.com"

          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/smartaxin/cloud-practice.git

          git push gitlab main